name: Windows packaging checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install source-test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-windows-rc.txt
      - name: Source privacy audit
        run: python tools/audit_public_source.py
      - name: Packaging, real smoke-runner failure paths and legal contracts
        env:
          MASTIXA_DATA_HOME: ${{ runner.temp }}\mastixa-packaging-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m unittest tests.test_phase16g_windows_packaging tests.test_windows_rc_release tests.test_windows_legal_gate tests.test_windows_legal_selection tests.test_windows_crt_policy tests.test_windows_tls_inputs tests.test_windows_mesa_policy tests.test_windows_epsg_provenance -v
      - name: Release configuration preflight
        run: python packaging/validate_windows_release.py
      # Actual installers require qualified supplier provisioning and owner
      # acceptance. This check workflow deliberately generates no release binary.
